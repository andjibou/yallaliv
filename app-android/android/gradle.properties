# Project-wide Gradle settings.

# For more details about how to configure your build environment, visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Memoire limitee (machine de build a 2 Go) + compilation Kotlin dans le processus Gradle
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process

# AndroidX package structure
android.useAndroidX=true
