name: Build APK Android (Livreur)

on:
  push:
    paths: ['app-android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dependances
        run: cd app-android && npm install --no-audit --no-fund

      - name: Synchroniser Capacitor
        run: cd app-android && npx cap sync android

      - name: Construire l'APK
        run: cd app-android/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Preparer l'artefact
        run: cp app-android/android/app/build/outputs/apk/debug/app-debug.apk YallaLiv-Livreur.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YallaLiv-Livreur-APK
          path: YallaLiv-Livreur.apk
          retention-days: 90
